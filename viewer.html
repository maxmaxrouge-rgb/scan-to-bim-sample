<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Illustrative IFC viewer</title><style>body{margin:0;background:#101b27;color:white;font:15px system-ui}header{padding:12px}a{color:#8ed8ff}#view{height:70vh}canvas{display:block}p{margin:8px 0}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><a href="index.html">Sample page</a> · <a href="QA.html">QA</a> · <a href="ATTRIBUTION.md">CC-BY-4.0 attribution</a><p>Prior: illustrative IFC from one scan. No accuracy claim. Inferred: element classes and extents require independent checks.</p><p>unknown: occlusion or opening not independently supported</p><p id="status" role="status">Loading IFC. Drag to orbit; scroll to zoom.</p></header><main id="view" aria-label="3D IFC sample"></main><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {IfcAPI} from 'https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/web-ifc-api.js';
const status=document.querySelector('#status'),host=document.querySelector('#view');
try {
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); host.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#101b27');
const camera=new THREE.PerspectiveCamera(50,1,0.01,10000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x536479,2)); const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(10,20,10);scene.add(light);
const api=new IfcAPI(); api.SetWasmPath('https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/'); await api.Init();
const response=await fetch('sample.ifc');if(!response.ok)throw Error('IFC HTTP '+response.status);
const model=api.OpenModel(new Uint8Array(await response.arrayBuffer()),{COORDINATE_TO_ORIGIN:true});const group=new THREE.Group();let count=0;
api.StreamAllMeshes(model,flat=>{for(let i=0;i<flat.geometries.size();i++){
const placed=flat.geometries.get(i),geometry=api.GetGeometry(model,placed.geometryExpressID);
const vertices=api.GetVertexArray(geometry.GetVertexData(),geometry.GetVertexDataSize()),indices=api.GetIndexArray(geometry.GetIndexData(),geometry.GetIndexDataSize());
const buffer=new THREE.BufferGeometry(),interleaved=new THREE.InterleavedBuffer(new Float32Array(vertices),6);buffer.setAttribute('position',new THREE.InterleavedBufferAttribute(interleaved,3,0));buffer.setAttribute('normal',new THREE.InterleavedBufferAttribute(interleaved,3,3));buffer.setIndex(new THREE.BufferAttribute(new Uint32Array(indices),1));
const c=placed.color,mesh=new THREE.Mesh(buffer,new THREE.MeshStandardMaterial({color:new THREE.Color(c.x,c.y,c.z),side:THREE.DoubleSide,roughness:0.8}));mesh.applyMatrix4(new THREE.Matrix4().fromArray(placed.flatTransformation));group.add(mesh);count++;geometry.delete();}});
api.CloseModel(model);scene.add(group); const box=new THREE.Box3().setFromObject(group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()).length();if(!count||!Number.isFinite(size)||!size)throw Error('No renderable geometry');
controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(size*.7,size*.6,size*.7));camera.near=size/1000;camera.far=size*100;camera.updateProjectionMatrix();
function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();}resize();window.addEventListener('resize',resize);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
status.textContent='Verified (this browser run): '+count+' mesh parts loaded. Drag to orbit; scroll to zoom.';window.sampleViewerResult={meshes:count};
}catch(error){status.textContent='Viewer failed: '+error.message+'. The IFC download and QA report remain available.';window.sampleViewerError=String(error);console.error(error);}
</script></body></html>
